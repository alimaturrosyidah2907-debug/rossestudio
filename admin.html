<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RosseAdmin — Dashboard CMS RosseStudio</title>
    <meta name="description" content="Panel manajemen konten dinamis RosseStudio berbasis Firebase Firestore & Auth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg-canvas: #0a0a0a;
        --bg-ambient: #110505;
        --bg-surface: rgba(18, 8, 10, 0.76);
        --text-primary: #f8f4f4;
        --text-muted: #b8a6a8;
        --accent-primary: #dc2626;
        --accent-deep: #8b0000;
        --glow-crimson: rgba(220, 38, 38, 0.45);
        --border-hairline: rgba(255, 255, 255, 0.1);
        --border-crimson: rgba(220, 38, 38, 0.35);
      }

      body {
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
      }

      .ambient-backdrop {
        background-color: var(--bg-canvas);
        background-image:
          radial-gradient(ellipse 75% 48% at 88% 4%, rgba(139, 0, 0, 0.25), transparent 70%),
          radial-gradient(ellipse 65% 45% at 10% 90%, rgba(127, 29, 29, 0.16), transparent 72%);
      }

      .glass-panel {
        background-color: var(--bg-surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-hairline);
      }

      .bento-card {
        background: linear-gradient(155deg, rgba(22, 10, 12, 0.8), rgba(10, 6, 7, 0.9));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-hairline);
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .bento-card:hover {
        border-color: var(--border-crimson);
        box-shadow: 0 0 18px var(--glow-crimson);
      }

      .btn-crimson {
        background: linear-gradient(135deg, var(--accent-deep), var(--accent-primary));
        color: #ffffff;
        border: 1px solid rgba(255, 110, 110, 0.28);
        transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      }

      .btn-crimson:hover {
        box-shadow: 0 0 18px var(--glow-crimson);
        transform: translateY(-1px);
      }

      .modal-surface {
        animation: modalScaleIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes modalScaleIn {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="ambient-backdrop min-h-screen flex flex-col selection:bg-red-700 selection:text-white">
    <!-- Toast Feedback Banner -->
    <div
      id="toast-banner"
      role="status"
      aria-live="polite"
      class="hidden fixed top-5 right-5 z-[90] max-w-sm rounded-2xl px-4 py-3 text-xs sm:text-sm font-medium shadow-2xl border backdrop-blur-md"
    ></div>

    <!-- SCREEN 1: Login Gate -->
    <main id="auth-screen" class="flex-1 flex items-center justify-center p-6">
      <div class="bento-card w-full max-w-md rounded-3xl p-8 sm:p-10 space-y-7 border border-red-500/20 shadow-2xl">
        <div class="text-center space-y-3">
          <div class="flex justify-center">
            <img
              src="/assets/logo-rossestudio.png"
              alt="RosseStudio"
              class="h-12 w-auto object-contain brightness-0 invert"
              referrerpolicy="no-referrer"
            />
          </div>
          <h1 class="font-display text-2xl sm:text-3xl font-semibold text-white">Masuk ke RosseAdmin</h1>
          <p class="text-xs sm:text-sm" style="color: var(--text-muted);">
            Kelola seluruh konten portofolio RosseStudio secara real-time.
          </p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="login-email" class="block text-xs font-medium mb-1.5 text-neutral-300">Email Admin</label>
            <input
              id="login-email"
              type="email"
              required
              autocomplete="email"
              placeholder="admin@rossestudio.com"
              class="w-full rounded-xl bg-black/55 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500"
            />
          </div>
          <div>
            <label for="login-password" class="block text-xs font-medium mb-1.5 text-neutral-300">Kata Sandi</label>
            <input
              id="login-password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Masukkan kata sandi"
              class="w-full rounded-xl bg-black/55 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500"
            />
          </div>
          <div id="login-error" class="hidden rounded-xl bg-red-950/70 border border-red-500/40 px-3.5 py-2.5 text-xs text-red-200"></div>
          <button
            id="btn-login-submit"
            type="submit"
            class="btn-crimson w-full py-3 rounded-xl text-sm font-semibold"
          >
            Masuk dengan Email
          </button>
        </form>

        <div class="relative flex items-center justify-center">
          <div class="w-full border-t border-white/10"></div>
          <span class="px-3 text-xs uppercase tracking-wider bg-[#100708] text-neutral-400">atau</span>
          <div class="w-full border-t border-white/10"></div>
        </div>

        <button
          id="btn-google-login"
          type="button"
          class="w-full py-3 px-4 rounded-xl border border-white/15 bg-black/40 hover:border-red-500/45 hover:bg-red-950/20 transition-all text-sm font-medium text-white flex items-center justify-center gap-2.5"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.25-.98 2.31-2.08 3.02l3.36 2.61c1.96-1.81 3.09-4.47 3.09-7.63 0-.74-.07-1.45-.19-2.13H12z"/>
            <path fill="#34A853" d="M12 22c2.81 0 5.17-.93 6.89-2.52l-3.36-2.61c-.93.62-2.12.99-3.53.99-2.71 0-5.01-1.83-5.83-4.29H2.7v2.7C4.41 19.67 7.93 22 12 22z"/>
            <path fill="#FBBC05" d="M6.17 13.57A5.95 5.95 0 015.86 12c0-.54.09-1.07.31-1.57V7.73H2.7A9.97 9.97 0 002 12c0 1.61.39 3.13 1.07 4.47l3.1-2.9z"/>
            <path fill="#4285F4" d="M12 6.14c1.53 0 2.9.53 3.98 1.56l2.98-2.98C17.16 3.05 14.8 2 12 2 7.93 2 4.41 4.33 2.7 7.73l3.47 2.7c.82-2.46 3.12-4.29 5.83-4.29z"/>
          </svg>
          <span>Masuk dengan Google</span>
        </button>

        <div class="pt-2 text-center">
          <a href="index.html" class="text-xs text-neutral-400 hover:text-white transition-colors">Kembali ke Halaman Portofolio</a>
        </div>
      </div>
    </main>

    <!-- SCREEN 2: Authenticated Admin Workspace -->
    <div id="admin-screen" class="hidden flex-1 flex flex-col lg:flex-row">
      <!-- Desktop Sidebar -->
      <aside class="hidden lg:flex lg:w-72 lg:flex-col border-r border-white/10 bg-black/55 backdrop-blur-xl p-5 justify-between shrink-0">
        <div class="space-y-6">
          <div class="flex items-center justify-between px-2">
            <a href="index.html" class="flex items-center gap-2 focus:outline-none">
              <img src="/assets/logo-rossestudio.png" alt="RosseAdmin" class="h-8 w-auto object-contain brightness-0 invert" referrerpolicy="no-referrer" />
            </a>
            <span class="text-xs font-medium text-red-300">Admin</span>
          </div>
          <nav id="sidebar-nav" aria-label="Menu Admin" class="space-y-1"></nav>
        </div>

        <div class="pt-4 border-t border-white/10 space-y-2.5">
          <div class="px-2">
            <div id="admin-user-email" class="text-xs text-neutral-300 truncate"></div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-export-json" type="button" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 hover:border-red-500/50 transition-colors">
              Export JSON
            </button>
            <label class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 hover:border-red-500/50 transition-colors text-center cursor-pointer">
              Import JSON
              <input id="input-import-json" type="file" accept="application/json" class="hidden" />
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <a href="index.html" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 hover:border-red-500/50 transition-colors text-center">
              Lihat Web
            </a>
            <button id="btn-logout" type="button" class="px-3 py-2 rounded-xl bg-red-950/60 border border-red-500/30 text-xs font-semibold text-red-200 hover:bg-red-900/60 transition-colors">
              Keluar
            </button>
          </div>
        </div>
      </aside>

      <!-- Mobile Header & Drawer -->
      <header class="lg:hidden sticky top-0 z-30 glass-panel border-x-0 border-t-0 px-4 py-3 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center">
          <img src="/assets/logo-rossestudio.png" alt="RosseAdmin" class="h-7 w-auto object-contain brightness-0 invert" referrerpolicy="no-referrer" />
        </a>
        <div class="flex items-center gap-2">
          <a href="index.html" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200">Web</a>
          <button id="btn-admin-drawer" type="button" aria-label="Buka menu admin" aria-expanded="false" class="min-w-[42px] min-h-[42px] rounded-xl border border-white/15 flex items-center justify-center text-white">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </header>

      <div id="admin-mobile-drawer" class="hidden lg:hidden glass-panel border-x-0 border-t-0 p-4 space-y-4">
        <nav id="mobile-sidebar-nav" class="grid grid-cols-2 gap-1.5"></nav>
        <div class="pt-3 border-t border-white/10 flex flex-wrap gap-2">
          <button id="btn-export-json-mobile" type="button" class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200">Export JSON</button>
          <label class="px-3 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 cursor-pointer">
            Import JSON
            <input id="input-import-json-mobile" type="file" accept="application/json" class="hidden" />
          </label>
          <button id="btn-logout-mobile" type="button" class="px-3 py-2 rounded-xl bg-red-950/60 border border-red-500/30 text-xs font-semibold text-red-200">Keluar</button>
        </div>
      </div>

      <!-- Main Workspace Area -->
      <main class="flex-1 p-5 sm:p-8 lg:p-10 max-w-6xl w-full mx-auto space-y-6">
        <!-- Email Verification Warning Banner -->
        <div id="verify-banner" class="hidden rounded-2xl p-4 bg-red-950/60 border border-red-500/40 flex flex-wrap items-center justify-between gap-4">
          <div class="text-xs sm:text-sm text-red-100">
            Email akun Anda belum terverifikasi. Aturan keamanan Firestore mewajibkan email terverifikasi untuk menyimpan perubahan.
          </div>
          <div class="flex items-center gap-2">
            <button id="btn-resend-verify" type="button" class="btn-crimson px-3.5 py-2 rounded-xl text-xs font-semibold">Kirim Email Verifikasi</button>
            <button id="btn-refresh-auth" type="button" class="px-3.5 py-2 rounded-xl border border-white/20 text-xs font-medium text-white">Muat Ulang Status</button>
          </div>
        </div>

        <div id="admin-content" class="space-y-6"></div>
      </main>
    </div>

    <!-- POP-UP MODAL 1: Universal CRUD Form Modal -->
    <div
      id="modal-crud"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/80 backdrop-blur-md"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-crud-title"
    >
      <div class="modal-surface glass-panel w-full max-w-2xl max-h-[90vh] rounded-3xl flex flex-col overflow-hidden border border-red-500/30 shadow-2xl">
        <div class="px-6 py-5 border-b border-white/10 flex items-center justify-between gap-4">
          <h2 id="modal-crud-title" class="font-display text-xl sm:text-2xl font-semibold text-white truncate"></h2>
          <button
            type="button"
            id="btn-close-crud"
            aria-label="Tutup form"
            class="min-w-[40px] min-h-[40px] rounded-xl border border-white/15 flex items-center justify-center text-neutral-300 hover:text-white hover:border-red-500/50 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="crud-form" class="p-6 overflow-y-auto space-y-4">
          <div id="crud-fields" class="space-y-4"></div>
          <div class="pt-4 border-t border-white/10 flex items-center justify-end gap-3">
            <button type="button" id="btn-cancel-crud" class="px-5 py-2.5 rounded-xl border border-white/15 text-xs sm:text-sm font-medium text-neutral-300 hover:text-white">
              Batal
            </button>
            <button type="submit" id="btn-save-crud" class="btn-crimson px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold">
              Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- POP-UP MODAL 2: In-Page Delete Confirmation (No window.confirm) -->
    <div
      id="modal-confirm-delete"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-delete-title"
    >
      <div class="modal-surface glass-panel w-full max-w-md rounded-3xl p-6 sm:p-7 border border-red-500/35 shadow-2xl space-y-5">
        <div class="space-y-2">
          <h3 id="confirm-delete-title" class="font-display text-xl font-semibold text-white">Hapus Data Ini?</h3>
          <p id="confirm-delete-desc" class="text-xs sm:text-sm" style="color: var(--text-muted);"></p>
        </div>
        <div class="flex items-center justify-end gap-3">
          <button id="btn-cancel-delete" type="button" class="px-4 py-2 rounded-xl border border-white/15 text-xs font-medium text-neutral-300 hover:text-white">
            Batal
          </button>
          <button id="btn-confirm-delete" type="button" class="btn-crimson px-5 py-2 rounded-xl text-xs font-semibold">
            Ya, Hapus Permanen
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        auth,
        db,
        googleProvider,
        THEME_PALETTES,
        COLLECTIONS,
        escapeHtml,
        compressImageToBase64,
        readPdfAsDataUrl,
        sortByNewest,
        signInWithEmailAndPassword,
        signInWithPopup,
        sendEmailVerification,
        signOut,
        onAuthStateChanged,
        collection,
        doc,
        getDoc,
        getDocs,
        setDoc,
        addDoc,
        updateDoc,
        deleteDoc,
        onSnapshot,
        serverTimestamp,
        writeBatch,
      } from './firebase-config.js';

      const NAV_ITEMS = [
        { id: 'overview', label: 'Ringkasan' },
        { id: 'hero', label: 'Hero & Profil' },
        { id: 'about', label: 'Tentang & Trivia' },
        { id: 'educations', label: 'Pendidikan' },
        { id: 'experiences', label: 'Pengalaman' },
        { id: 'achievements', label: 'Prestasi' },
        { id: 'certificates', label: 'Sertifikat' },
        { id: 'skills', label: 'Skills' },
        { id: 'categories', label: 'Kategori Keahlian' },
        { id: 'portfolios', label: 'Portofolio' },
        { id: 'testimonials', label: 'Testimoni' },
        { id: 'faqs', label: 'FAQ' },
        { id: 'footer', label: 'Kontak & Maps' },
        { id: 'messages', label: 'Kotak Masuk' },
        { id: 'themes', label: 'Tema Warna' },
      ];

      const adminState = {
        user: null,
        activeSection: 'overview',
        hero: null,
        about: null,
        educations: [],
        experiences: [],
        achievements: [],
        certificates: [],
        skills: [],
        categories: [],
        portfolios: [],
        testimonials: [],
        faqs: [],
        footer: null,
        messages: [],
        activeTheme: 'obsidian-crimson',
        modalContext: null,
        pendingDelete: null,
        unsubscribers: [],
      };

      const toastEl = document.getElementById('toast-banner');
      let toastTimer = null;
      function showToast(message, isError = false) {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.className = `fixed top-5 right-5 z-[90] max-w-sm rounded-2xl px-4 py-3 text-xs sm:text-sm font-medium shadow-2xl border backdrop-blur-md ${
          isError
            ? 'bg-red-950/90 border-red-500/50 text-red-100'
            : 'bg-[#120b0c]/95 border-red-500/35 text-white'
        }`;
        toastEl.classList.remove('hidden');
        toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 4200);
      }

      // Auth handlers
      const authScreen = document.getElementById('auth-screen');
      const adminScreen = document.getElementById('admin-screen');
      const loginErrorEl = document.getElementById('login-error');

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        loginErrorEl.classList.add('hidden');
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.textContent = 'Memproses...';
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          loginErrorEl.textContent = 'Email atau kata sandi tidak valid, atau akun belum terdaftar di Firebase Auth.';
          loginErrorEl.classList.remove('hidden');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Masuk dengan Email';
        }
      });

      document.getElementById('btn-google-login').addEventListener('click', async () => {
        loginErrorEl.classList.add('hidden');
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          loginErrorEl.textContent = 'Login Google dibatalkan atau gagal diproses.';
          loginErrorEl.classList.remove('hidden');
        }
      });

      const handleLogout = async () => {
        adminState.unsubscribers.forEach((unsub) => unsub());
        adminState.unsubscribers = [];
        await signOut(auth);
      };
      document.getElementById('btn-logout').addEventListener('click', handleLogout);
      document.getElementById('btn-logout-mobile').addEventListener('click', handleLogout);

      document.getElementById('btn-resend-verify').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        try {
          await sendEmailVerification(auth.currentUser);
          showToast('Tautan verifikasi telah dikirim ke email Anda.');
        } catch {
          showToast('Gagal mengirim email verifikasi saat ini.', true);
        }
      });

      document.getElementById('btn-refresh-auth').addEventListener('click', async () => {
        if (!auth.currentUser) return;
        await auth.currentUser.reload();
        updateVerifyBanner();
        showToast('Status akun diperbarui.');
      });

      function updateVerifyBanner() {
        const banner = document.getElementById('verify-banner');
        if (adminState.user && !adminState.user.emailVerified) {
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }
      }

      onAuthStateChanged(auth, async (user) => {
        adminState.user = user;
        if (!user) {
          authScreen.classList.remove('hidden');
          adminScreen.classList.add('hidden');
          return;
        }
        authScreen.classList.add('hidden');
        adminScreen.classList.remove('hidden');
        document.getElementById('admin-user-email').textContent = user.email || user.uid;
        updateVerifyBanner();
        subscribeAdminCollections();
        renderSidebar();
        renderActiveSection();

        // Ensure bootstrapped admin marker/user profile exists quietly if verified
        if (user.emailVerified && user.email === 'alimaturrosyidah2907@gmail.com') {
          try {
            const adminRef = doc(db, 'admins', user.uid);
            const snap = await getDoc(adminRef);
            if (!snap.exists()) {
              await setDoc(adminRef, {
                email: user.email,
                role: 'admin',
                createdAt: serverTimestamp(),
              });
            }
          } catch {
            // Silent fallback if rules or offline state prevent write
          }
        }
      });

      function subscribeAdminCollections() {
        adminState.unsubscribers.forEach((u) => u());
        adminState.unsubscribers = [];

        const watchSingleton = (colName, key, fallback = null) => {
          const unsub = onSnapshot(collection(db, colName), (snap) => {
            adminState[key] = snap.docs[0] ? { id: snap.docs[0].id, ...snap.docs[0].data() } : fallback;
            renderActiveSection();
          }, () => {});
          adminState.unsubscribers.push(unsub);
        };

        const watchList = (colName, key) => {
          const unsub = onSnapshot(collection(db, colName), (snap) => {
            adminState[key] = sortByNewest(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            renderSidebar();
            renderActiveSection();
          }, () => {});
          adminState.unsubscribers.push(unsub);
        };

        watchSingleton('hero_settings', 'hero');
        watchSingleton('about_settings', 'about');
        watchSingleton('footer_contacts', 'footer');
        watchList('educations', 'educations');
        watchList('experiences', 'experiences');
        watchList('achievements', 'achievements');
        watchList('certificates', 'certificates');
        watchList('skills', 'skills');
        watchList('expertise_categories', 'categories');
        watchList('portfolio_items', 'portfolios');

      function fieldInputHtml(field, currentVal = '') {
        const val = escapeHtml(currentVal || '');
        const req = field.required ? 'required' : '';
        if (field.type === 'textarea') {
          return `
            <div>
              <label for="f-${field.name}" class="block text-xs font-medium mb-1.5 text-neutral-300">${escapeHtml(field.label)}</label>
              <textarea id="f-${field.name}" name="${field.name}" rows="${field.rows || 4}" ${req} placeholder="${escapeHtml(field.placeholder || '')}" class="w-full rounded-xl bg-black/60 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500">${val}</textarea>

        }
        if (field.type === 'select') {
          return `
            <div>
              <label for="f-${field.name}" class="block text-xs font-medium mb-1.5 text-neutral-300">${escapeHtml(field.label)}</label>
              <select id="f-${field.name}" name="${field.name}" ${req} class="w-full rounded-xl bg-black/60 border border-white/15 px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                ${(field.options || []).map((opt) => `<option value="${escapeHtml(opt.value)}" ${String(currentVal) === String(opt.value) ? 'selected' : ''}>${escapeHtml(opt.label)}</option>`).join('')}
              </select>
            </div>
          `;
        }
        if (field.type === 'image') {
          return `
            <div class="space-y-2">
              <label class="block text-xs font-medium text-neutral-300">${escapeHtml(field.label)}</label>
              <input type="hidden" id="f-${field.name}" name="${field.name}" value="${val}" />
              <div class="flex flex-wrap items-center gap-3">
                <label class="px-4 py-2 rounded-xl border border-white/15 bg-black/50 hover:border-red-500/50 text-xs font-medium text-neutral-200 cursor-pointer">
                  Pilih Gambar
                  <input type="file" accept="image/*" data-img-target="f-${field.name}" class="hidden" />
                </label>
                <button type="button" data-clear-target="f-${field.name}" class="px-3 py-2 rounded-xl border border-white/10 text-xs text-neutral-400 hover:text-white">Hapus Gambar</button>
              </div>
              <div id="preview-f-${field.name}" class="pt-1">
                ${currentVal ? `<img src="${val}" alt="Pratinjau" class="h-24 w-auto rounded-xl object-cover border border-white/15" referrerpolicy="no-referrer" />` : `<span class="text-xs text-neutral-500">Belum ada gambar dipilih.</span>`}
              </div>
            </div>
          `;
        }
        if (field.type === 'pdf') {
          return `
            <div class="space-y-2">
              <label class="block text-xs font-medium text-neutral-300">${escapeHtml(field.label)}</label>
              <input type="hidden" id="f-${field.name}" name="${field.name}" value="${val}" />
              <div class="flex flex-wrap items-center gap-3">

                </label>

                ${currentVal ? 'File PDF tersimpan dan siap diunduh pengunjung.' : 'Belum ada file CV diunggah.'}
              </div>
            </div>
          `;
        }
        return `
          <div>
            <label for="f-${field.name}" class="block text-xs font-medium mb-1.5 text-neutral-300">${escapeHtml(field.label)}</label>
            <input id="f-${field.name}" name="${field.name}" type="${field.type || 'text'}" ${req} value="${val}" placeholder="${escapeHtml(field.placeholder || '')}" class="w-full rounded-xl bg-black/60 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500" />

      function openCrudModal(colName, existingDoc = null) {
        const schema = SCHEMAS[colName];
        if (!schema) return;
        if (colName === 'portfolio_items' && adminState.categories.length === 0) {
          showToast('Buat minimal 1 Kategori Keahlian terlebih dahulu sebelum menambah Portofolio.', true);
          return;
        }
        adminState.modalContext = { colName, docId: existingDoc?.id || schema.singletonId || null, existingDoc };
        crudTitle.textContent = existingDoc || schema.singletonId ? `Edit ${schema.title}` : `Tambah ${schema.title}`;

        const fieldsHtml = schema.fields
          .map((f) => {
            const hydratedField = f.dynamicCategory
              ? {
                  ...f,
                  options: adminState.categories.map((c) => ({ value: c.id, label: c.title })),
                }
              : f;
            return fieldInputHtml(hydratedField, existingDoc?.[f.name] || '');
          })
          .join('');
        crudFieldsEl.innerHTML = fieldsHtml;

        // Bind image compression uploaders
        crudFieldsEl.querySelectorAll('[data-img-target]').forEach((input) => {
          input.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const targetId = input.dataset.imgTarget;
            try {
              const base64 = await compressImageToBase64(file);
              document.getElementById(targetId).value = base64;
              document.getElementById(`preview-${targetId}`).innerHTML = `<img src="${escapeHtml(base64)}" alt="Pratinjau" class="h-24 w-auto rounded-xl object-cover border border-white/15" />`;
            } catch (err) {
              showToast(err.message || 'Gagal memproses gambar.', true);
            }
          });
        });

        crudFieldsEl.querySelectorAll('[data-clear-target]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const targetId = btn.dataset.clearTarget;
            document.getElementById(targetId).value = '';
            document.getElementById(`preview-${targetId}`).innerHTML = '<span class="text-xs text-neutral-500">Gambar dihapus.</span>';
          });
        });

        crudFieldsEl.querySelectorAll('[data-pdf-target]').forEach((input) => {
          input.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const targetId = input.dataset.pdfTarget;
            try {
              const dataUrl = await readPdfAsDataUrl(file);
              document.getElementById(targetId).value = dataUrl;
              document.getElementById(`preview-${targetId}`).textContent = `File "${file.name}" siap disimpan.`;
            } catch (err) {
              showToast(err.message || 'Gagal membaca PDF.', true);
            }
          });
        });

        crudFieldsEl.querySelectorAll('[data-clear-pdf]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const targetId = btn.dataset.clearPdf;
            document.getElementById(targetId).value = '';
            document.getElementById(`preview-${targetId}`).textContent = 'File CV dihapus.';
          });
        });

        crudModal.classList.remove('hidden');
      }

      crudForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!adminState.modalContext) return;
        const { colName, docId, existingDoc } = adminState.modalContext;
        const schema = SCHEMAS[colName];
        const saveBtn = document.getElementById('btn-save-crud');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Menyimpan...';

        try {
          const data = {};
          const formData = new FormData(crudForm);
          schema.fields.forEach((f) => {
            const val = String(formData.get(f.name) ?? '').trim();
            if (val || !schema.singletonId) {
              if (val) data[f.name] = val;
            }
            // Allow clearing optional strings cleanly on update
            if ((val === '' && existingDoc && !f.required) || schema.singletonId) {
              data[f.name] = val;
            }
          });

          if (schema.singletonId) {
            await setDoc(doc(db, colName, schema.singletonId), {
              ...data,
              updatedAt: serverTimestamp(),
            });
          } else if (docId) {
            await updateDoc(doc(db, colName, docId), {
              ...data,
              updatedAt: serverTimestamp(),
            });
          } else {
            await addDoc(collection(db, colName), {
              ...data,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp(),
            });
          }

          showToast(`${schema.title} berhasil disimpan.`);
          closeCrudModal();
        } catch (err) {
          console.error(err);
          showToast('Gagal menyimpan ke Firestore. Periksa verifikasi email dan aturan keamanan.', true);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Simpan Perubahan';
        }
      });

        if (s === 'footer') {
          const f = adminState.footer || {};
          root.innerHTML = `
            <div class="space-y-6">
              <div class="flex flex-wrap items-center justify-between gap-4">
                <h1 class="font-display text-3xl font-semibold text-white">Kontak, Google Maps &amp; CV</h1>
                <button type="button" id="btn-edit-singleton" class="btn-crimson px-5 py-2.5 rounded-xl text-xs font-semibold">Edit Kontak &amp; Footer</button>
              </div>
              <div class="bento-card rounded-3xl p-6 sm:p-8 grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div><span class="text-xs text-red-300 block">Email</span>${escapeHtml(f.email || '—')}</div>
                <div><span class="text-xs text-red-300 block">WhatsApp</span>${escapeHtml(f.wa || '—')}</div>
                <div><span class="text-xs text-red-300 block">Instagram</span>${escapeHtml(f.ig || '—')}</div>
                <div><span class="text-xs text-red-300 block">LinkedIn</span>${escapeHtml(f.linkedin || '—')}</div>
                <div class="sm:col-span-2"><span class="text-xs text-red-300 block">Alamat</span>${escapeHtml(f.alamat_teks || '—')}</div>
                <div class="sm:col-span-2"><span class="text-xs text-red-300 block">Copyright Footer</span>${escapeHtml(f.teks_copyright_dinamis || '—')}</div>
              </div>
            </div>
          `;
          document.getElementById('btn-edit-singleton').addEventListener('click', () => openCrudModal('footer_contacts', adminState.footer));
          return;
        }

        if (s === 'themes') {
          root.innerHTML = `
            <div class="space-y-6">
              <div>
                <h1 class="font-display text-3xl font-semibold text-white">Tema Warna Situs</h1>
                <p class="text-sm mt-1" style="color: var(--text-muted);">Pilih palet gelap aktif untuk halaman utama RosseStudio.</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${Object.values(THEME_PALETTES).map((p) => {
                  const active = adminState.activeTheme === p.id;
                  return `
                    <button type="button" data-select-theme="${escapeHtml(p.id)}" class="bento-card rounded-2xl p-5 text-left space-y-3 ${active ? 'border-red-500 shadow-[0_0_20px_rgba(220,38,38,0.4)]' : ''}">
                      <div class="flex items-center justify-between gap-2">
                        <span class="font-semibold text-sm text-white">${escapeHtml(p.label)}</span>
                        ${active ? '<span class="text-xs text-red-300 font-semibold">Aktif</span>' : ''}
                      </div>
                      <p class="text-xs" style="color: var(--text-muted);">${escapeHtml(p.description)}</p>
                      <div class="flex items-center gap-2 pt-1">
                        ${p.swatches.map((hex) => `<span class="w-6 h-6 rounded-lg border border-white/15" style="background-color:${hex}"></span>`).join('')}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
          root.querySelectorAll('[data-select-theme]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                await setDoc(doc(db, 'site_themes', 'active'), {
                  active_theme_name: btn.dataset.selectTheme,
                  updatedAt: serverTimestamp(),
                });
                showToast('Tema situs diperbarui.');
              } catch {
                showToast('Gagal mengganti tema. Pastikan email terverifikasi.', true);
              }
            });
          });
          return;
        }

        if (s === 'messages') {
          root.innerHTML = `
            <div class="space-y-6">
              <div>
                <h1 class="font-display text-3xl font-semibold text-white">Kotak Masuk Pengunjung</h1>
                <p class="text-sm mt-1" style="color: var(--text-muted);">Pesan yang dikirim melalui formulir kontak di halaman utama.</p>
              </div>
              ${adminState.messages.length === 0 ? `
                <div class="bento-card rounded-2xl p-10 text-center text-sm" style="color: var(--text-muted);">Belum ada pesan masuk dari pengunjung.</div>
              ` : `
                <div class="grid grid-cols-1 gap-4">
                  ${adminState.messages.map((m) => `
                    <div class="bento-card rounded-2xl p-6 space-y-3">
                      <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <div class="text-xs font-medium text-red-300">${escapeHtml(m.nama)} · ${escapeHtml(m.email)}</div>
                          <h3 class="font-display text-lg font-semibold text-white mt-0.5">${escapeHtml(m.subjek)}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                          <a href="mailto:${escapeHtml(m.email)}?subject=${encodeURIComponent('Re: ' + m.subjek)}" class="px-3 py-1.5 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 hover:border-red-500/50">Balas Email</a>
                          <button type="button" data-del-msg="${escapeHtml(m.id)}" data-del-label="${escapeHtml(m.subjek)}" class="px-3 py-1.5 rounded-xl border border-red-500/30 text-xs font-medium text-red-300 hover:bg-red-950/40">Hapus</button>
                        </div>
                      </div>
                      <p class="text-sm whitespace-pre-line" style="color: var(--text-muted);">${escapeHtml(m.pesan)}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          `;
          root.querySelectorAll('[data-del-msg]').forEach((btn) => {
            btn.addEventListener('click', () => requestDelete('contact_messages', btn.dataset.delMsg, btn.dataset.delLabel));
          });
          return;
        }

        // Generic Collection List Views (Educations, Experiences, Achievements, Certificates, Skills, Categories, Portfolios, Testimonials, FAQs)
        const listConfigs = {
          educations: { col: 'educations', items: adminState.educations, title: 'Riwayat Pendidikan', head: (x) => x.institusi, sub: (x) => `${x.jurusan} · ${x.tahun_masuk} – ${x.tahun_lulus}`, body: (x) => x.deskripsi },
          experiences: { col: 'experiences', items: adminState.experiences, title: 'Pengalaman', head: (x) => x.posisi, sub: (x) => `${x.kategori_pengalaman} · ${x.institusi_tempat} · ${x.durasi}`, body: (x) => x.deskripsi },
          achievements: { col: 'achievements', items: adminState.achievements, title: 'Prestasi', head: (x) => x.judul_prestasi, sub: (x) => `${x.penyelenggara} · ${x.tahun}`, body: (x) => x.deskripsi },
          certificates: { col: 'certificates', items: adminState.certificates, title: 'Sertifikat', head: (x) => x.judul, sub: (x) => `${x.penerbit} · ${x.tahun}`, img: (x) => x.gambar_sertifikat },
          skills: { col: 'skills', items: adminState.skills, title: 'Skills & Perangkat', head: (x) => x.nama_skill, sub: () => 'Skill Aktif', img: (x) => x.logo_icon },
          categories: { col: 'expertise_categories', items: adminState.categories, title: 'Kategori Keahlian', head: (x) => x.title, sub: (x) => x.tagline, img: (x) => x.cover_image },
          portfolios: {
            col: 'portfolio_items',
            items: adminState.portfolios,
            title: 'Item Portofolio',
            head: (x) => x.title,
            sub: (x) => {
              const cat = adminState.categories.find((c) => c.id === x.category_id);
              return `${cat?.title || 'Kategori'} ${x.price_or_tech ? '· ' + x.price_or_tech : ''}`;
            },
            body: (x) => x.description,
            img: (x) => x.image,
          },
          testimonials: { col: 'testimonials', items: adminState.testimonials, title: 'Testimoni Klien', head: (x) => x.nama_klien, sub: (x) => x.peran, body: (x) => x.isi_review, img: (x) => x.foto_profil_opsional },
          faqs: { col: 'faqs', items: adminState.faqs, title: 'Pertanyaan Umum (FAQ)', head: (x) => x.pertanyaan, sub: () => 'Pertanyaan & Jawaban', body: (x) => x.jawaban },
        };

        const cfg = listConfigs[s];
        if (!cfg) return;

        root.innerHTML = `
          <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 class="font-display text-3xl font-semibold text-white">${escapeHtml(cfg.title)}</h1>
                <p class="text-sm mt-1 tabular-nums" style="color: var(--text-muted);">${cfg.items.length} data tersimpan di Firestore.</p>
              </div>
              <button type="button" id="btn-add-item" class="btn-crimson px-5 py-2.5 rounded-xl text-xs font-semibold">Tambah ${escapeHtml(cfg.title)}</button>
            </div>

            ${cfg.items.length === 0 ? `
              <div class="bento-card rounded-2xl p-10 text-center space-y-3">
                <p class="text-sm" style="color: var(--text-muted);">Belum ada data ${escapeHtml(cfg.title.toLowerCase())}. Klik tombol tambah untuk membuka pop-up form.</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${cfg.items.map((item) => {
                  const thumb = cfg.img ? cfg.img(item) : '';
                  const bodyText = cfg.body ? cfg.body(item) : '';
                  return `
                    <article class="bento-card rounded-2xl p-5 flex flex-col justify-between gap-4">
                      <div class="flex items-start gap-4">
                        ${thumb ? `<img src="${escapeHtml(thumb)}" alt="" class="w-16 h-16 rounded-xl object-cover border border-white/15 shrink-0" referrerpolicy="no-referrer" />` : ''}
                        <div class="min-w-0 flex-1 space-y-1">
                          <div class="text-xs font-medium text-red-300 truncate">${escapeHtml(cfg.sub(item) || '')}</div>
                          <h2 class="font-display text-lg font-semibold text-white line-clamp-1">${escapeHtml(cfg.head(item) || '')}</h2>
                          ${bodyText ? `<p class="text-xs line-clamp-2" style="color: var(--text-muted);">${escapeHtml(bodyText)}</p>` : ''}
                        </div>
                      </div>
                      <div class="pt-3 border-t border-white/10 flex items-center justify-end gap-2">
                        <button type="button" data-edit-id="${escapeHtml(item.id)}" class="px-3.5 py-1.5 rounded-xl border border-white/15 text-xs font-medium text-neutral-200 hover:border-red-500/50 transition-colors">Edit</button>
                        <button type="button" data-del-id="${escapeHtml(item.id)}" data-del-label="${escapeHtml(cfg.head(item))}" class="px-3.5 py-1.5 rounded-xl border border-red-500/30 text-xs font-medium text-red-300 hover:bg-red-950/40 transition-colors">Hapus</button>
                      </div>
                    </article>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;

        document.getElementById('btn-add-item').addEventListener('click', () => openCrudModal(cfg.col, null));
        root.querySelectorAll('[data-edit-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = cfg.items.find((x) => x.id === btn.dataset.editId);
            openCrudModal(cfg.col, target);
          });
        });
        root.querySelectorAll('[data-del-id]').forEach((btn) => {
          btn.addEventListener('click', () => requestDelete(cfg.col, btn.dataset.delId, btn.dataset.delLabel));
        });
      }

      // Export / Import JSON Backup
      async function handleExportJson() {
        try {
          const backup = { exportedAt: new Date().toISOString(), collections: {} };
          for (const colName of COLLECTIONS) {
            const snap = await getDocs(collection(db, colName));
            backup.collections[colName] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          }
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `rossestudio-backup-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Backup JSON berhasil diekspor.');
        } catch {
          showToast('Gagal mengekspor data JSON.', true);
        }
      }

      async function handleImportJson(file) {
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const cols = parsed?.collections || parsed;
          if (!cols || typeof cols !== 'object') {
            throw new Error('Format file JSON tidak dikenali.');
          }
          const orderedCols = [
            'site_themes',
            'hero_settings',
            'about_settings',
            'footer_contacts',
            'educations',
            'experiences',
            'achievements',
            'certificates',
            'skills',
            'expertise_categories',
            'portfolio_items',
            'testimonials',
            'faqs',
          ];

          for (const colName of orderedCols) {
            const list = cols[colName];
            if (!Array.isArray(list) || list.length === 0) continue;
            const batch = writeBatch(db);
            for (const row of list) {
              if (!row?.id) continue;
              const { id, createdAt, updatedAt, ...rest } = row;
              const isSingleton = ['site_themes', 'hero_settings', 'about_settings', 'footer_contacts'].includes(colName);
              batch.set(doc(db, colName, id), {
                ...rest,
                ...(isSingleton ? {} : { createdAt: serverTimestamp() }),
                updatedAt: serverTimestamp(),
              });
            }
            await batch.commit();
          }
          showToast('Backup JSON berhasil diimpor ke Firestore.');
        } catch (err) {
          showToast(err.message || 'Gagal mengimpor file JSON.', true);
        }
      }

      document.getElementById('btn-export-json').addEventListener('click', handleExportJson);
      document.getElementById('btn-export-json-mobile').addEventListener('click', handleExportJson);
      document.getElementById('input-import-json').addEventListener('change', (e) => handleImportJson(e.target.files?.[0]));
      document.getElementById('input-import-json-mobile').addEventListener('change', (e) => handleImportJson(e.target.files?.[0]));
    </script>
  </body>
</html>
