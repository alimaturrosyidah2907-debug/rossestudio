<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RosseStudio — Portfolio CMS</title>
    <meta
      name="description"
      content="RosseStudio — Portofolio multi-talenta dinamis yang menghadirkan harmoni teknologi dan estetika."
    />
    <meta property="og:title" content="RosseStudio — Portfolio CMS" />
    <meta
      property="og:description"
      content="RosseStudio — Portofolio multi-talenta dinamis yang menghadirkan harmoni teknologi dan estetika."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg-canvas: #0a0a0a;
        --bg-ambient: #110505;
        --bg-surface: rgba(18, 8, 10, 0.72);
        --bg-surface-solid: #13090b;
        --bg-surface-alt: rgba(28, 10, 12, 0.85);
        --bg-glass: rgba(10, 10, 10, 0.72);
        --text-primary: #f8f4f4;
        --text-muted: #b8a6a8;
        --accent-primary: #dc2626;
        --accent-deep: #8b0000;
        --accent-bright: #ff3333;
        --accent-hover: #ef4444;
        --accent-soft: #fca5a5;
        --accent-contrast: #ffffff;
        --glow-crimson: rgba(220, 38, 38, 0.48);
        --border-hairline: rgba(255, 255, 255, 0.1);
        --border-crimson: rgba(220, 38, 38, 0.35);
        --logo-color: #f8f4f4;
        --footer-bg: #070304;
        --footer-text: #f8f4f4;
        --morph-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      body {
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .ambient-backdrop {
        background-color: var(--bg-canvas);
        background-image:
          radial-gradient(ellipse 75% 48% at 85% 6%, rgba(139, 0, 0, 0.24), transparent 70%),
          radial-gradient(ellipse 65% 42% at 12% 38%, rgba(139, 0, 0, 0.12), transparent 70%),
          radial-gradient(ellipse 70% 50% at 80% 88%, rgba(127, 29, 29, 0.16), transparent 72%);
      }

      /* Organic Ambient Liquid Morph Orbs */
      .ambient-orbs-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .ambient-orb {
        position: absolute;
        filter: blur(72px);
        opacity: 0.42;
        will-change: transform, border-radius;
      }

      .ambient-orb-1 {
        top: -8%;
        right: -6%;
        width: 440px;
        height: 440px;
        background: radial-gradient(circle at 35% 35%, rgba(220, 38, 38, 0.42), rgba(139, 0, 0, 0.18) 65%, transparent 100%);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        animation: morphOrbA 16s ease-in-out infinite alternate;
      }

      .ambient-orb-2 {
        top: 34%;
        left: -10%;
        width: 390px;
        height: 390px;
        background: radial-gradient(circle at 60% 40%, rgba(185, 28, 28, 0.34), rgba(85, 4, 8, 0.16) 70%, transparent 100%);
        border-radius: 42% 58% 66% 34% / 44% 55% 45% 56%;
        animation: morphOrbB 20s ease-in-out infinite alternate;
      }

      .ambient-orb-3 {
        bottom: -10%;
        right: 12%;
        width: 420px;
        height: 420px;
        background: radial-gradient(circle at 45% 55%, rgba(255, 51, 51, 0.24), rgba(139, 0, 0, 0.14) 68%, transparent 100%);
        border-radius: 52% 48% 36% 64% / 62% 38% 62% 38%;
        animation: morphOrbA 22s ease-in-out infinite alternate-reverse;
      }

      @keyframes morphOrbA {
        0% {
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        }
        50% {
          border-radius: 44% 56% 58% 42% / 38% 62% 38% 62%;
          transform: translate3d(-24px, 28px, 0) scale(1.06) rotate(12deg);
        }
        100% {
          border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
          transform: translate3d(18px, -18px, 0) scale(0.95) rotate(-8deg);
        }
      }

      @keyframes morphOrbB {
        0% {
          border-radius: 42% 58% 66% 34% / 44% 55% 45% 56%;
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          border-radius: 66% 34% 45% 55% / 58% 42% 58% 42%;
          transform: translate3d(32px, -22px, 0) scale(1.08);
        }
        100% {
          border-radius: 35% 65% 52% 48% / 40% 60% 40% 60%;
          transform: translate3d(-16px, 24px, 0) scale(0.96);
        }
      }

      .glass-panel {
        background-color: var(--bg-surface);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--border-hairline);
      }

      /* Showcase Cards with Interactive Micro-Morph */
      .bento-card {
        background: linear-gradient(155deg, rgba(22, 10, 12, 0.78), rgba(10, 6, 7, 0.88));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-hairline);
        border-radius: 1.5rem;
        transition:
          transform 380ms var(--morph-ease),
          border-radius 380ms var(--morph-ease),
          border-color 280ms ease,
          box-shadow 380ms var(--morph-ease);
      }

      .bento-card:hover {
        border-color: var(--border-crimson);
        box-shadow: 0 0 26px var(--glow-crimson);
        transform: translateY(-3px) scale(1.005);
        border-radius: 1.85rem;
      }

      /* Outline-First Minimalist Dark-Glass Rows */
      .outline-shell {
        background: rgba(12, 7, 8, 0.42);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 1.15rem;
        transition:
          border-color 350ms var(--morph-ease),
          border-radius 420ms var(--morph-ease),
          box-shadow 350ms var(--morph-ease),
          background-color 350ms ease,
          transform 320ms var(--morph-ease);
      }

      .outline-shell:hover {
        border-color: rgba(220, 38, 38, 0.42);
        box-shadow: 0 0 20px rgba(220, 38, 38, 0.22);
        background: rgba(20, 9, 11, 0.62);
        border-radius: 1.45rem;
      }

      .outline-shell.is-expanded {
        background: linear-gradient(160deg, rgba(22, 9, 12, 0.86), rgba(10, 5, 6, 0.94));
        border-color: rgba(220, 38, 38, 0.45);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 0 26px rgba(139, 0, 0, 0.28);
        border-radius: 1.65rem;
      }

      .outline-plus-icon {
        transition: transform 420ms var(--morph-ease), color 250ms ease;
      }

      .outline-shell.is-expanded .outline-plus-icon {
        transform: rotate(45deg);
        color: #ff4d4d;
      }

      .portrait-halo {
        box-shadow:
          0 0 65px rgba(220, 38, 38, 0.42),
          0 0 22px rgba(255, 51, 51, 0.28),
          inset 0 0 24px rgba(139, 0, 0, 0.35);
      }

      .btn-crimson {
        background: linear-gradient(135deg, var(--accent-deep), var(--accent-primary));
        color: var(--accent-contrast);
        border: 1px solid rgba(255, 100, 100, 0.28);
        border-radius: 0.75rem;
        transition:
          transform 320ms var(--morph-ease),
          border-radius 320ms var(--morph-ease),
          box-shadow 320ms var(--morph-ease),
          opacity 200ms ease;
      }

      .btn-crimson:hover {
        box-shadow: 0 0 22px var(--glow-crimson);
        transform: translateY(-1px) scale(1.015);
        border-radius: 1.15rem;
      }

      .btn-outline-morph {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.75rem;
        transition:
          transform 320ms var(--morph-ease),
          border-radius 320ms var(--morph-ease),
          border-color 280ms ease,
          background-color 280ms ease,
          box-shadow 320ms ease;
      }

      .btn-outline-morph:hover {
        border-color: rgba(220, 38, 38, 0.55);
        background-color: rgba(139, 0, 0, 0.2);
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.28);
        border-radius: 1.15rem;
        transform: translateY(-1px);
      }

      .social-morph-box {
        width: 2.65rem;
        height: 2.65rem;
        border-radius: 0.8rem;
        background: rgba(18, 8, 10, 0.68);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition:
          transform 340ms var(--morph-ease),
          border-radius 340ms var(--morph-ease),
          border-color 260ms ease,
          box-shadow 340ms var(--morph-ease),
          background-color 260ms ease;
      }

      .social-morph-box:hover {
        border-color: rgba(255, 51, 51, 0.65);
        background: rgba(139, 0, 0, 0.35);
        box-shadow: 0 0 18px rgba(220, 38, 38, 0.45);
        border-radius: 1.15rem;
        transform: translateY(-2px) scale(1.06);
      }

      /* Fallback keyframe when modal opens without source card rect */
      .modal-surface.modal-fallback-in {
        animation: modalScaleIn 460ms var(--morph-ease) forwards;
      }

      @keyframes modalScaleIn {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(14px);
          border-radius: 2rem;
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
          border-radius: 1.5rem;
        }
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .headline-balance {
        text-wrap: balance;
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient-orb {
          animation: none !important;
        }
        [data-aos] {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        .bento-card:hover,
        .btn-crimson:hover,
        .btn-outline-morph:hover,
        .social-morph-box:hover,
        .outline-shell:hover {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body class="ambient-backdrop min-h-screen flex flex-col selection:bg-red-700 selection:text-white relative">
    <!-- Organic Liquid Glassmorphism Background Orbs -->
    <div class="ambient-orbs-layer" aria-hidden="true">
      <div class="ambient-orb ambient-orb-1"></div>
      <div class="ambient-orb ambient-orb-2"></div>
      <div class="ambient-orb ambient-orb-3"></div>
    </div>

    <!-- Floating Dark-Glass Navbar (Strict 3-Zone Contract) -->
    <header
      id="site-header"
      class="sticky top-0 z-40 px-4 sm:px-6 pt-3 pb-2 transition-all duration-200"
    >
      <div
        class="mx-auto max-w-6xl rounded-2xl px-4 sm:px-6 py-2.5 flex items-center justify-between gap-8"
        style="background-color: var(--bg-glass); backdrop-filter: blur(18px); border: 1px solid var(--border-hairline);"
      >
        <!-- Zone 1: Brand Wordmark -->
        <a
          href="#top"
          class="flex items-center gap-2 shrink-0 whitespace-nowrap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 rounded-lg"
          aria-label="RosseStudio Beranda"
        >
          <img
            src="./assets/logo-rossestudio.png"
            alt="RosseStudio"
            class="h-8 sm:h-9 w-auto object-contain brightness-0 invert"
            referrerpolicy="no-referrer"
            onerror="this.classList.add('hidden');this.nextElementSibling.classList.remove('hidden');"
          />
          <span class="hidden font-display text-lg font-bold tracking-tight text-white">RosseStudio</span>
        </a>

        <!-- Zone 2: Concise Single-Line Navigation -->
        <nav
          id="desktop-nav"
          aria-label="Navigasi Utama"
          class="hidden md:flex items-center gap-6 text-sm font-medium"
          style="color: var(--text-muted);"
        ></nav>

        <!-- Zone 3: Single Primary Action + Mobile Trigger -->
        <div class="flex items-center gap-3 shrink-0">
          <a
            href="admin.html"
            class="btn-crimson px-4 py-2 text-xs font-semibold whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-400"
          >
            RosseAdmin
          </a>
          <button
            id="btn-mobile-menu"
            type="button"
            aria-label="Buka menu navigasi"
            aria-expanded="false"
            class="md:hidden min-w-[44px] min-h-[44px] inline-flex items-center justify-center rounded-xl border border-white/10 text-neutral-200 hover:border-red-500/40 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Navigation Drawer -->
      <div
        id="mobile-drawer"
        class="hidden md:hidden mx-auto max-w-6xl mt-2 rounded-2xl p-4 glass-panel"
      >
        <nav id="mobile-nav" aria-label="Navigasi Seluler" class="flex flex-col gap-1"></nav>
      </div>
    </header>

    <!-- Main Dynamic Canvas -->
    <main id="top" class="flex-1 relative z-10">
      <!-- Initial Loading Shimmer (Cleared immediately once snapshot arrives) -->
      <div id="loading-state" class="mx-auto max-w-6xl px-6 py-20 space-y-8" aria-busy="true">
        <div class="bento-card p-8 sm:p-12 animate-pulse">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div class="lg:col-span-7 space-y-4">
              <div class="h-10 w-3/4 rounded-lg bg-white/10"></div>
              <div class="h-5 w-full rounded-lg bg-white/5"></div>
              <div class="h-5 w-5/6 rounded-lg bg-white/5"></div>
              <div class="pt-4 flex gap-3">
                <div class="h-10 w-36 rounded-xl bg-red-900/40"></div>
                <div class="h-10 w-32 rounded-xl bg-white/10"></div>
              </div>
            </div>
            <div class="lg:col-span-5 flex justify-center">
              <div class="w-60 h-60 rounded-full bg-white/5 border border-red-900/30"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 100% Dynamic Empty State -->
      <section
        id="empty-state"
        class="hidden mx-auto max-w-4xl px-6 py-20 sm:py-28"
        aria-label="Status Portofolio Kosong"
      >
        <div class="bento-card p-8 sm:p-14 text-center space-y-6">
          <div class="flex justify-center">
            <img
              src="./assets/logo-rossestudio.png"
              alt="RosseStudio"
              class="h-14 w-auto object-contain brightness-0 invert opacity-90"
              referrerpolicy="no-referrer"
              onerror="this.classList.add('hidden');this.nextElementSibling.classList.remove('hidden');"
            />
            <span class="hidden font-display text-2xl font-bold text-white">RosseStudio</span>
          </div>
          <h1 class="font-display text-3xl sm:text-4xl font-semibold headline-balance text-white">
            Ruang Portofolio Belum Diterbitkan
          </h1>
          <p class="max-w-xl mx-auto text-sm sm:text-base leading-relaxed" style="color: var(--text-muted);">
            Seluruh profil, proyek aplikasi, publikasi ilmiah, dan katalog karya RosseStudio dikelola secara dinamis melalui panel RosseAdmin.
          </p>
          <div class="pt-2 flex flex-wrap items-center justify-center gap-4">
            <a
              href="admin.html"
              class="btn-crimson px-6 py-3 text-sm font-semibold whitespace-nowrap shrink-0"
            >
              Kelola di RosseAdmin
            </a>
            <button
              id="btn-empty-contact"
              type="button"
              class="btn-outline-morph px-6 py-3 text-sm font-semibold text-neutral-100 whitespace-nowrap shrink-0"
            >
              Kirim Pesan
            </button>
          </div>
        </div>
      </section>

      <!-- Dynamic Sections Container -->
      <div id="dynamic-sections" class="hidden space-y-16 sm:space-y-24 pb-24">
        <!-- 1. Hero Section (Always Visible + Auto-Logo Social Boxes) -->
        <section id="hero" class="hidden mx-auto max-w-6xl px-6 pt-8 sm:pt-12"></section>

        <!-- 2. Outline-First Profile & Academic Block (Tentang Saya & Riwayat Pendidikan) -->
        <section id="tentang" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 3. Always Visible Showcase #1: Proyek Aplikasi & Website -->
        <section id="aplikasi" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 4. Gateway Showcase: Bidang Keahlian & Portofolio -->
        <section id="keahlian" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 5. Outline-First Experience, Achievements & Skills -->
        <section id="pengalaman" class="hidden mx-auto max-w-6xl px-6"></section>
        <section id="skills" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 6. Outline-First Creative Studio: Karya Desain & Video Tutorial -->
        <section id="karya-kreatif" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 7. Outline-First Publications: Buku & Karya Ilmiah / Jurnal -->
        <section id="publikasi" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 8. Always Visible Showcase #2: Sertifikasi & Lisensi -->
        <section id="sertifikat" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 9. Outline-First Testimonials & FAQ -->
        <section id="testimoni" class="hidden mx-auto max-w-6xl px-6"></section>
        <section id="faq" class="hidden mx-auto max-w-6xl px-6"></section>

        <!-- 10. Always Visible Showcase #3: Kontak & Google Maps -->
        <section id="kontak" class="hidden mx-auto max-w-6xl px-6"></section>
      </div>
    </main>

    <!-- Dynamic Footer Bar -->
    <footer
      id="site-footer"
      class="hidden relative z-10 border-t border-white/10 py-8 px-6 text-center text-xs sm:text-sm"
      style="background-color: var(--footer-bg); color: var(--text-muted);"
    ></footer>

    <!-- Floating WhatsApp Button -->
    <a
      id="floating-wa"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Chat via WhatsApp"
      class="hidden fixed bottom-5 right-5 z-30 min-w-[48px] min-h-[48px] px-4 py-2.5 rounded-full btn-crimson items-center gap-2 text-xs font-semibold shadow-2xl"
    >
      <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span class="whitespace-nowrap">WhatsApp</span>
    </a>

    <!-- MODAL 1: Expertise Category Portfolio Explorer -->
    <div
      id="modal-portfolio"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/80 backdrop-blur-md transition-opacity duration-300"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-portfolio-title"
    >
      <div class="modal-surface glass-panel w-full max-w-5xl max-h-[90vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl border border-red-500/25">
        <div class="px-6 py-5 border-b border-white/10 flex items-center justify-between gap-4">
          <div class="min-w-0">
            <h2 id="modal-portfolio-title" class="font-display text-xl sm:text-2xl font-semibold text-white truncate"></h2>
            <p id="modal-portfolio-subtitle" class="text-xs sm:text-sm truncate mt-0.5" style="color: var(--text-muted);"></p>
          </div>
          <button
            type="button"
            data-close-modal="modal-portfolio"
            aria-label="Tutup galeri portofolio"
            class="min-w-[40px] min-h-[40px] rounded-xl border border-white/10 flex items-center justify-center text-neutral-300 hover:text-white hover:border-red-500/50 transition-colors shrink-0"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div id="modal-portfolio-tabs" class="px-6 py-3 border-b border-white/10 flex flex-wrap gap-2 bg-black/30"></div>
        <div id="modal-portfolio-grid" class="p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </div>
    </div>

    <!-- MODAL 2: Single Portfolio Item Detail -->
    <div
      id="modal-portfolio-detail"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 sm:p-6 bg-black/85 backdrop-blur-md transition-opacity duration-300"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detail-title"
    >
      <div class="modal-surface glass-panel w-full max-w-3xl max-h-[90vh] rounded-3xl overflow-y-auto border border-red-500/30 shadow-2xl">
        <div class="relative">
          <div id="detail-media" class="w-full min-h-[240px] max-h-[60vh] bg-black/60 overflow-hidden flex items-center justify-center"></div>
          <button
            type="button"
            data-close-modal="modal-portfolio-detail"
            aria-label="Tutup detail karya"
            class="absolute top-4 right-4 min-w-[40px] min-h-[40px] rounded-full bg-black/75 border border-white/15 flex items-center justify-center text-white hover:border-red-500 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script type="module">
      import {
        db,
        testFirestoreConnection,
        applyThemePalette,
        escapeHtml,
        resolveGoogleMapsDisplay,
        normalizeExternalUrl,
        formatWhatsAppUrl,
        formatInstagramUrl,
        detectSocialPlatform,
        parseTagList,
        classifyMediaPreview,
        parseTriviaItems,
        validateContactMessageInput,
        hasHeroData,
        hasAboutData,
        hasFooterData,
        isPortfolioStateEmpty,
        sortByNewest,
        filterExperiencesByCategory,
        collection,
        addDoc,
        onSnapshot,
        serverTimestamp,
      } from './firebase-config.js';

      if (window.AOS) {
        window.AOS.init({
          duration: 720,
          easing: 'ease-out-cubic',
          once: true,
          offset: 40,
          disable: () => window.matchMedia('(prefers-reduced-motion: reduce)').matches,
        });
      }

      const state = {
        loadedCollections: new Set(),
        hero: null,
        heroSocials: [],
        about: null,
        educations: [],
        experiences: [],
        achievements: [],
        certificates: [],
        skills: [],
        categories: [],
        portfolios: [],
        appProjects: [],
        designs: [],
        tutorials: [],
        books: [],
        journals: [],
        testimonials: [],
        faqs: [],
        footer: null,
        activeTheme: 'obsidian-crimson',
        activeExpTab: 'Profesional',
        expandedOutlines: new Set(),
        activeCategoryModalId: null,
        activePortfolioList: [],
        activePortfolioIndex: 0,
        activeCertIndex: 0,
        activeTestimonialIndex: 0,
      };

      const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const modalSourceMap = new Map();

      const loadingEl = document.getElementById('loading-state');
      const emptyEl = document.getElementById('empty-state');
      const sectionsWrapperEl = document.getElementById('dynamic-sections');
      const footerBarEl = document.getElementById('site-footer');
      const floatingWaEl = document.getElementById('floating-wa');

      const markLoaded = (key) => {
        state.loadedCollections.add(key);
        if (state.loadedCollections.size >= 3) {
          loadingEl.classList.add('hidden');
          loadingEl.setAttribute('aria-busy', 'false');
        }
        renderAll();
      };

      setTimeout(() => {
        if (!loadingEl.classList.contains('hidden')) {
          loadingEl.classList.add('hidden');
          loadingEl.setAttribute('aria-busy', 'false');
          renderAll();
        }
      }, 2500);

      // Mobile drawer toggle
      const mobileMenuBtn = document.getElementById('btn-mobile-menu');
      const mobileDrawer = document.getElementById('mobile-drawer');
      mobileMenuBtn.addEventListener('click', () => {
        const isHidden = mobileDrawer.classList.toggle('hidden');
        mobileMenuBtn.setAttribute('aria-expanded', String(!isHidden));
      });

      /**
       * FLIP (First, Last, Invert, Play) morph helper for Card-to-Modal & Outline-to-Detail.
       */
      function openModalWithMorph(id, sourceEl = null) {
        const el = document.getElementById(id);
        if (!el) return;
        const surface = el.querySelector('.modal-surface');
        if (!surface) return;

        modalSourceMap.set(id, sourceEl && sourceEl.isConnected ? sourceEl : null);
        const firstRect = sourceEl && !prefersReducedMotion() ? sourceEl.getBoundingClientRect() : null;
        const firstRadius = firstRect ? getComputedStyle(sourceEl).borderRadius || '20px' : null;

        surface.classList.remove('modal-fallback-in');
        surface.style.transition = 'none';
        surface.style.transform = '';
        surface.style.opacity = '';
        surface.style.borderRadius = '';

        el.classList.remove('hidden');
        el.style.opacity = '0';
        document.body.style.overflow = 'hidden';

        if (!firstRect || firstRect.width < 16 || firstRect.height < 16) {
          el.style.opacity = '1';
          if (!prefersReducedMotion()) {
            surface.classList.add('modal-fallback-in');
          }
          return;
        }

        const lastRect = surface.getBoundingClientRect();
        const dx = firstRect.left + firstRect.width / 2 - (lastRect.left + lastRect.width / 2);
        const dy = firstRect.top + firstRect.height / 2 - (lastRect.top + lastRect.height / 2);
        const sx = Math.max(0.28, Math.min(1.1, firstRect.width / Math.max(1, lastRect.width)));
        const sy = Math.max(0.22, Math.min(1.1, firstRect.height / Math.max(1, lastRect.height)));

        surface.style.transformOrigin = 'center center';
        surface.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sx}, ${sy})`;
        surface.style.borderRadius = firstRadius;
        surface.style.opacity = '0.35';

        // Force layout then animate to final state
        surface.getBoundingClientRect();
        requestAnimationFrame(() => {
          el.style.opacity = '1';
          surface.style.transition =
            'transform 500ms cubic-bezier(0.22, 1, 0.36, 1), border-radius 500ms cubic-bezier(0.22, 1, 0.36, 1), opacity 320ms ease';
          surface.style.transform = 'translate3d(0, 0, 0) scale(1, 1)';
          surface.style.borderRadius = '1.5rem';
          surface.style.opacity = '1';
          setTimeout(() => {
            surface.style.transition = '';
            surface.style.transform = '';
            surface.style.borderRadius = '';
          }, 520);
        });
      }

      function closeModal(id) {
        const el = document.getElementById(id);
        if (!el || el.classList.contains('hidden')) return;
        const surface = el.querySelector('.modal-surface');
        const sourceEl = modalSourceMap.get(id);

        const finishClose = () => {
          el.classList.add('hidden');
          el.style.opacity = '';
          if (surface) {
            surface.style.transition = '';
            surface.style.transform = '';
            surface.style.opacity = '';
            surface.style.borderRadius = '';
          }
          // Pause any playing HTML5 video inside modals
          el.querySelectorAll('video').forEach((v) => v.pause());
          const anyOpen = [
            'modal-portfolio',
            'modal-portfolio-detail',
            'modal-universal-detail',
            'modal-lightbox',
            'modal-contact',
          ].some((mid) => !document.getElementById(mid).classList.contains('hidden'));
          if (!anyOpen) document.body.style.overflow = '';
        };

        if (prefersReducedMotion() || !surface) {
          finishClose();
          return;
        }

        el.style.opacity = '0';
        if (sourceEl && sourceEl.isConnected) {
          const targetRect = sourceEl.getBoundingClientRect();
          const curRect = surface.getBoundingClientRect();
          const dx = targetRect.left + targetRect.width / 2 - (curRect.left + curRect.width / 2);
          const dy = targetRect.top + targetRect.height / 2 - (curRect.top + curRect.height / 2);
          const sx = Math.max(0.28, Math.min(1, targetRect.width / Math.max(1, curRect.width)));
          const sy = Math.max(0.22, Math.min(1, targetRect.height / Math.max(1, curRect.height)));
          surface.style.transition =
            'transform 340ms cubic-bezier(0.22, 1, 0.36, 1), opacity 260ms ease, border-radius 340ms ease';
          surface.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sx}, ${sy})`;
          surface.style.opacity = '0';
        } else {
          surface.style.transition = 'transform 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease';
          surface.style.transform = 'scale(0.94) translateY(10px)';
          surface.style.opacity = '0';
        }
        setTimeout(finishClose, 330);
      }

      document.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
      });

      ['modal-portfolio', 'modal-portfolio-detail', 'modal-universal-detail', 'modal-lightbox', 'modal-contact'].forEach((id) => {
        const backdrop = document.getElementById(id);
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) closeModal(id);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!document.getElementById('modal-universal-detail').classList.contains('hidden')) {
            closeModal('modal-universal-detail');
          } else if (!document.getElementById('modal-portfolio-detail').classList.contains('hidden')) {
            closeModal('modal-portfolio-detail');
          } else if (!document.getElementById('modal-lightbox').classList.contains('hidden')) {
            closeModal('modal-lightbox');
          } else if (!document.getElementById('modal-portfolio').classList.contains('hidden')) {
            closeModal('modal-portfolio');
          } else if (!document.getElementById('modal-contact').classList.contains('hidden')) {
            closeModal('modal-contact');
          }
        } else if (e.key === 'ArrowLeft') {
          if (!document.getElementById('modal-portfolio-detail').classList.contains('hidden')) {
            stepPortfolioDetail(-1);
          } else if (!document.getElementById('modal-lightbox').classList.contains('hidden')) {
            stepLightbox(-1);
          }
        } else if (e.key === 'ArrowRight') {
          if (!document.getElementById('modal-portfolio-detail').classList.contains('hidden')) {
            stepPortfolioDetail(1);
          } else if (!document.getElementById('modal-lightbox').classList.contains('hidden')) {
            stepLightbox(1);
          }
        }
      });

      document.getElementById('btn-empty-contact').addEventListener('click', (e) => openModalWithMorph('modal-contact', e.currentTarget));

      /**
       * Outline-First Click-to-Expand helper with FLIP transform morph.
       */
      function bindOutlineTriggers(container) {
        container.querySelectorAll('[data-outline-toggle]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const key = btn.dataset.outlineToggle;
            const shell = btn.closest('.outline-shell');
            const panel = shell?.querySelector('[data-outline-panel]');
            if (!shell || !panel) return;

            const isCurrentlyOpen = state.expandedOutlines.has(key);
            if (isCurrentlyOpen) {
              state.expandedOutlines.delete(key);
            } else {
              state.expandedOutlines.add(key);
            }

            const applyToggleDom = () => {
              shell.classList.toggle('is-expanded', !isCurrentlyOpen);
              btn.setAttribute('aria-expanded', String(!isCurrentlyOpen));
              panel.classList.toggle('hidden', isCurrentlyOpen);
            };

            if (prefersReducedMotion()) {
              applyToggleDom();
              return;
            }

            // FLIP First
            const firstRect = shell.getBoundingClientRect();
            const firstRadius = getComputedStyle(shell).borderRadius;

            // Update DOM -> Last
            applyToggleDom();
            const lastRect = shell.getBoundingClientRect();

            // Invert & Play via GPU transform + opacity on panel
            const scaleY = Math.max(0.25, firstRect.height / Math.max(1, lastRect.height));
            shell.style.transformOrigin = 'top center';
            shell.style.transition = 'none';
            shell.style.transform = `scaleY(${scaleY})`;
            shell.style.borderRadius = firstRadius;

            if (!isCurrentlyOpen) {
              panel.style.opacity = '0';
              panel.style.transform = 'translateY(10px)';
            }

            shell.getBoundingClientRect();
            requestAnimationFrame(() => {
              shell.style.transition =
                'transform 490ms cubic-bezier(0.22, 1, 0.36, 1), border-radius 490ms cubic-bezier(0.22, 1, 0.36, 1), border-color 320ms ease, box-shadow 350ms ease';
              shell.style.transform = 'scaleY(1)';
              shell.style.borderRadius = !isCurrentlyOpen ? '1.65rem' : '1.15rem';

              if (!isCurrentlyOpen) {
                panel.style.transition = 'opacity 420ms ease 90ms, transform 460ms cubic-bezier(0.22, 1, 0.36, 1) 60ms';
                panel.style.opacity = '1';
                panel.style.transform = 'translateY(0)';
              }

              setTimeout(() => {
                shell.style.transition = '';
                shell.style.transform = '';
                shell.style.borderRadius = '';
                panel.style.transition = '';
                panel.style.opacity = '';
                panel.style.transform = '';
              }, 520);
            });
          });
        });
      }

      function renderOutlineSectionShell({ key, title, subtitle, countLabel = '', innerHtml = '', iconSvg = '' }) {
        const isOpen = state.expandedOutlines.has(key);
        return `
          <div class="outline-shell overflow-hidden ${isOpen ? 'is-expanded' : ''}" data-aos="fade-up">
            <button
              type="button"
              data-outline-toggle="${escapeHtml(key)}"
              aria-expanded="${isOpen ? 'true' : 'false'}"
              class="w-full px-6 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 rounded-2xl"
            >
              <div class="flex items-center gap-4 min-w-0">
                <div class="w-10 h-10 rounded-xl border border-white/15 bg-black/45 flex items-center justify-center text-red-300 shrink-0">
                  ${iconSvg}
                </div>
                <div class="min-w-0">
                  <div class="flex flex-wrap items-baseline gap-x-2.5 gap-y-0.5">
                    <h2 class="font-display text-xl sm:text-2xl font-semibold text-white truncate">${escapeHtml(title)}</h2>
                    ${countLabel ? `<span class="text-xs font-medium text-red-300/90 tabular-nums whitespace-nowrap">${escapeHtml(countLabel)}</span>` : ''}
                  </div>
                  ${subtitle ? `<p class="text-xs sm:text-sm truncate mt-0.5" style="color: var(--text-muted);">${escapeHtml(subtitle)}</p>` : ''}
                </div>
              </div>
              <span class="w-10 h-10 rounded-xl border border-white/12 flex items-center justify-center text-neutral-300 shrink-0">
                <svg class="outline-plus-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
                </svg>

      // Render Media Block helper for Cards & Universal Modal
      function renderVisualMediaBox(mediaInfo, title, heightClass = 'h-60 sm:h-72', autoplayEmbed = false) {
        if (mediaInfo.kind === 'image') {
          return `<img src="${escapeHtml(mediaInfo.src)}" alt="${escapeHtml(title)}" class="w-full ${heightClass} object-cover" referrerpolicy="no-referrer" />`;
        }
        if (mediaInfo.kind === 'video') {
          return `<video controls playsinline preload="metadata" src="${escapeHtml(mediaInfo.src)}" class="w-full ${heightClass} object-cover bg-black"></video>`;
        }
        if (mediaInfo.kind === 'video-embed' || (autoplayEmbed && mediaInfo.embedSrc)) {
          return `
            <div class="w-full ${heightClass} bg-black relative">
              <iframe
                src="${escapeHtml(mediaInfo.embedSrc)}"
                title="${escapeHtml(title)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"
                class="w-full h-full border-0"
              ></iframe>
            </div>
          `;
        }
        if (mediaInfo.kind === 'pdf') {
          return `
            <div class="w-full ${heightClass} bg-gradient-to-br from-red-950/60 via-black to-black flex flex-col items-center justify-center gap-2 p-6 text-center">
              <div class="w-14 h-14 rounded-2xl border border-red-500/40 bg-red-950/50 flex items-center justify-center text-red-200 font-bold text-sm">PDF</div>
              <div class="text-xs sm:text-sm font-medium text-white truncate max-w-full">${escapeHtml(mediaInfo.downloadName || title)}</div>
              <div class="text-xs" style="color: var(--text-muted);">Klik untuk membuka pembaca PDF</div>
            </div>
          `;
        }
        if (mediaInfo.kind === 'file') {
          return `
            <div class="w-full ${heightClass} bg-gradient-to-br from-red-950/50 via-black to-black flex flex-col items-center justify-center gap-2 p-6 text-center">
              <div class="px-3.5 py-2 rounded-xl border border-red-500/40 bg-red-950/50 text-red-200 font-bold text-xs tracking-wider">${escapeHtml(mediaInfo.extLabel || 'FILE')}</div>
              <div class="text-xs sm:text-sm font-medium text-white truncate max-w-full">${escapeHtml(mediaInfo.downloadName || title)}</div>
              <div class="text-xs" style="color: var(--text-muted);">Klik untuk detail &amp; unduhan file</div>
            </div>
          `;
        }
        return `
          <div class="w-full ${heightClass} bg-gradient-to-br from-red-950/55 via-[#110505] to-black flex items-center justify-center p-6 text-center">
            <span class="font-display text-2xl text-red-300/60">${escapeHtml((title || 'RS').slice(0, 24))}</span>
          </div>
        `;
      }

        } else if (primaryMedia.embedSrc) {

      // Shared Contact Form Submission
      async function handleContactSubmit(formEl, statusEl) {
        const formData = new FormData(formEl);
        const check = validateContactMessageInput({
          nama: formData.get('nama'),
          email: formData.get('email'),
          subjek: formData.get('subjek'),
          pesan: formData.get('pesan'),
        });
        statusEl.className = 'text-xs rounded-xl px-3.5 py-2.5';
        if (!check.valid) {
          statusEl.classList.add('bg-red-950/70', 'border', 'border-red-500/40', 'text-red-200');
          statusEl.textContent = check.error;
          return;
        }
        const submitBtn = formEl.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Mengirim...';
        try {
          await addDoc(collection(db, 'contact_messages'), {
            ...check.payload,
            createdAt: serverTimestamp(),
          });
          formEl.reset();
          statusEl.classList.add('bg-emerald-950/60', 'border', 'border-emerald-500/40', 'text-emerald-200');
          statusEl.textContent = 'Pesan berhasil terkirim. Terima kasih telah menghubungi RosseStudio.';
        } catch (err) {
          console.error('Contact form write failed:', err);
          statusEl.classList.add('bg-red-950/70', 'border', 'border-red-500/40', 'text-red-200');
          statusEl.textContent = 'Pesan gagal dikirim saat ini. Silakan coba lagi atau hubungi lewat WhatsApp/Email.';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      }

      document.getElementById('popup-contact-form').addEventListener('submit', (e) => {
        e.preventDefault();
        handleContactSubmit(e.currentTarget, document.getElementById('popup-contact-status'));
      });

      function openCategoryModal(categoryId, sourceEl = null) {
        state.activeCategoryModalId = categoryId;
        const cat = state.categories.find((c) => c.id === categoryId) || state.categories[0];
        if (!cat) return;

        document.getElementById('modal-portfolio-title').textContent = cat.title;
        document.getElementById('modal-portfolio-subtitle').textContent = cat.tagline || '';

        const tabsEl = document.getElementById('modal-portfolio-tabs');
        tabsEl.innerHTML = state.categories
          .map(
            (c) => `
              <button
                type="button"
                data-switch-cat="${escapeHtml(c.id)}"
                class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all whitespace-nowrap shrink-0 ${c.id === cat.id ? 'btn-crimson' : 'text-neutral-300 hover:text-white border border-white/10'}"
              >
                ${escapeHtml(c.title)}
              </button>
            `
          )
          .join('');

        tabsEl.querySelectorAll('[data-switch-cat]').forEach((btn) => {
          btn.addEventListener('click', () => openCategoryModal(btn.dataset.switchCat, null));
        });

        const items = state.portfolios.filter((p) => p.category_id === cat.id);
        state.activePortfolioList = items;

        const gridEl = document.getElementById('modal-portfolio-grid');
        if (items.length === 0) {
          gridEl.innerHTML = `
            <div class="col-span-full py-12 text-center text-sm" style="color: var(--text-muted);">
              Belum ada karya yang ditambahkan ke kategori ini.
            </div>
          `;
        } else {
          gridEl.innerHTML = items
            .map((item, idx) => {
              const mInfo = classifyMediaPreview(item.image, item.image_nama, item.link_url);
              return `
                <button
                  type="button"
                  data-open-detail="${idx}"
                  class="bento-card text-left overflow-hidden flex flex-col focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
                >
                  <div class="w-full h-44 bg-black/60 overflow-hidden">
                    ${renderVisualMediaBox(mInfo, item.title, 'h-44', false)}
                  </div>
                  <div class="p-4 space-y-1.5 flex-1">
                    ${item.price_or_tech ? `<div class="text-xs font-medium text-red-300 truncate">${escapeHtml(item.price_or_tech)}</div>` : ''}
                    <h3 class="font-display text-lg font-semibold text-white line-clamp-1">${escapeHtml(item.title)}</h3>
                    <p class="text-xs line-clamp-2" style="color: var(--text-muted);">${escapeHtml(item.description)}</p>
                  </div>
                </button>
              `;
            })
            .join('');
          gridEl.querySelectorAll('[data-open-detail]').forEach((btn) => {
            btn.addEventListener('click', (e) => openPortfolioDetail(Number(btn.dataset.openDetail), e.currentTarget));
          });
        }
        openModalWithMorph('modal-portfolio', sourceEl);
      }

      function openPortfolioDetail(index, sourceEl = null) {
        if (!state.activePortfolioList.length) return;
        const len = state.activePortfolioList.length;
        state.activePortfolioIndex = ((index % len) + len) % len;
        const item = state.activePortfolioList[state.activePortfolioIndex];
        const mInfo = classifyMediaPreview(item.image, item.image_nama, item.link_url);

        const mediaEl = document.getElementById('detail-media');
        if (mInfo.kind === 'pdf') {
          mediaEl.innerHTML = `<iframe src="${escapeHtml(mInfo.src)}" title="${escapeHtml(item.title)}" class="w-full h-[46vh] border-0"></iframe>`;
        } else if (mInfo.kind === 'video') {
          mediaEl.innerHTML = `<video controls playsinline src="${escapeHtml(mInfo.src)}" class="w-full max-h-80 object-contain"></video>`;
        } else if (mInfo.kind === 'video-embed') {
          mediaEl.innerHTML = `<iframe src="${escapeHtml(mInfo.embedSrc)}" title="${escapeHtml(item.title)}" allowfullscreen class="w-full h-72 border-0"></iframe>`;
        } else {
          mediaEl.innerHTML = renderVisualMediaBox(mInfo, item.title, 'h-64 sm:h-80', false);
        }

        document.getElementById('detail-title').textContent = item.title || '';
        document.getElementById('detail-meta').textContent = item.price_or_tech || '';
        document.getElementById('detail-desc').textContent = item.description || '';

        const dlEl = document.getElementById('detail-download');
        if (mInfo.hasFile && mInfo.src) {
          dlEl.href = mInfo.src;
          dlEl.download = mInfo.downloadName || 'karya-rossestudio';
          dlEl.classList.remove('hidden');
          dlEl.classList.add('inline-flex');
        } else {
          dlEl.classList.add('hidden');
          dlEl.classList.remove('inline-flex');
        }

        const linkEl = document.getElementById('detail-link');
        const ext = normalizeExternalUrl(item.link_url);
        if (ext) {
          linkEl.href = ext;
          linkEl.classList.remove('hidden');
          linkEl.classList.add('inline-flex');
        } else {
          linkEl.classList.add('hidden');
          linkEl.classList.remove('inline-flex');
        }

        document.getElementById('btn-detail-prev').disabled = len <= 1;
        document.getElementById('btn-detail-next').disabled = len <= 1;
        openModalWithMorph('modal-portfolio-detail', sourceEl);
      }

      function stepPortfolioDetail(delta) {
        if (state.activePortfolioList.length <= 1) return;
        openPortfolioDetail(state.activePortfolioIndex + delta, null);
      }

      document.getElementById('btn-detail-prev').addEventListener('click', () => stepPortfolioDetail(-1));
      document.getElementById('btn-detail-next').addEventListener('click', () => stepPortfolioDetail(1));

      function openLightbox(index, sourceEl = null) {
        if (!state.certificates.length) return;
        const len = state.certificates.length;
        state.activeCertIndex = ((index % len) + len) % len;
        const cert = state.certificates[state.activeCertIndex];
        const mediaInfo = classifyMediaPreview(cert.gambar_sertifikat, cert.gambar_sertifikat_nama, cert.link_url);

        document.getElementById('lightbox-title').textContent = cert.judul;
        document.getElementById('lightbox-meta').textContent = `${cert.penerbit} · ${cert.tahun}`;
        document.getElementById('lightbox-counter').textContent = `${state.activeCertIndex + 1} / ${len}`;

        const lbMedia = document.getElementById('lightbox-media');
        if (mediaInfo.kind === 'pdf') {
          lbMedia.innerHTML = `<iframe src="${escapeHtml(mediaInfo.src)}" title="${escapeHtml(cert.judul)}" class="w-full h-[58vh] rounded-xl border-0"></iframe>`;
        } else if (mediaInfo.kind === 'image') {
          lbMedia.innerHTML = `<img src="${escapeHtml(mediaInfo.src)}" alt="${escapeHtml(cert.judul)}" class="max-h-[60vh] w-auto object-contain rounded-xl" referrerpolicy="no-referrer" />`;
        } else if (mediaInfo.kind === 'file') {
          lbMedia.innerHTML = `<div class="py-12 text-center space-y-2"><div class="inline-block px-4 py-2 rounded-xl bg-red-950/60 border border-red-500/40 text-red-200 font-bold text-xs">${escapeHtml(mediaInfo.extLabel)}</div><div class="text-sm text-white">${escapeHtml(mediaInfo.downloadName)}</div></div>`;
        } else {
          lbMedia.innerHTML = `<div class="py-16 text-sm" style="color: var(--text-muted);">Pratinjau dokumen sertifikat tidak dilampirkan.</div>`;
        }

        const actionsEl = document.getElementById('lightbox-actions');
        const btns = [];
        if (mediaInfo.hasFile && mediaInfo.src) {
          btns.push(
            `<a href="${escapeHtml(mediaInfo.src)}" download="${escapeHtml(mediaInfo.downloadName)}" class="btn-outline-morph px-4 py-2 text-xs font-semibold text-white">Lihat / Unduh File</a>`
          );
        }
        const ext = normalizeExternalUrl(cert.link_url);
        if (ext) {
          btns.push(
            `<a href="${escapeHtml(ext)}" target="_blank" rel="noopener noreferrer" class="btn-crimson px-4 py-2 text-xs font-semibold">Buka Tautan</a>`
          );
        }
        actionsEl.innerHTML = btns.join('');

        openModalWithMorph('modal-lightbox', sourceEl);
      }

      function stepLightbox(delta) {
        if (state.certificates.length <= 1) return;
        openLightbox(state.activeCertIndex + delta, null);
      }

      document.getElementById('btn-cert-prev').addEventListener('click', () => stepLightbox(-1));
      document.getElementById('btn-cert-next').addEventListener('click', () => stepLightbox(1));

          <div class="space-y-8">
            <div data-aos="fade-up">
              <h2 class="font-display text-3xl sm:text-4xl font-semibold text-white headline-balance">Mari Berkolaborasi</h2>
              <p class="text-sm mt-1.5" style="color: var(--text-muted);">Sampaikan kebutuhan proyek atau jadwal Anda melalui formulir berikut.</p>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
              <div class="lg:col-span-5 bento-card p-6 sm:p-8 flex flex-col justify-between space-y-6" data-aos="fade-right">
                <div class="space-y-4">
                  ${
                    f.alamat_teks
                      ? `
                    <div>
                      <div class="text-xs font-medium text-red-300">Lokasi</div>
                      <div class="text-sm text-white mt-0.5">${escapeHtml(f.alamat_teks)}</div>
                    </div>
                  `
                      : ''
                  }
                  ${
                    f.email
                      ? `
                    <div>
                      <div class="text-xs font-medium text-red-300">Email</div>
                      <a href="mailto:${escapeHtml(f.email)}" class="text-sm text-white hover:text-red-300 transition-colors mt-0.5 inline-block">${escapeHtml(f.email)}</a>
                    </div>
                  `
                      : ''
                  }
                  ${
                    waUrl
                      ? `
                    <div>
                      <div class="text-xs font-medium text-red-300">WhatsApp</div>
                      <a href="${escapeHtml(waUrl)}" target="_blank" rel="noopener noreferrer" class="text-sm text-white hover:text-red-300 transition-colors mt-0.5 inline-block tabular-nums">${escapeHtml(f.wa)}</a>
                    </div>
                  `
                      : ''
                  }
                  <div class="flex flex-wrap gap-3 pt-2">
                    ${igUrl ? `<a href="${escapeHtml(igUrl)}" target="_blank" rel="noopener noreferrer" class="btn-outline-morph px-3.5 py-2 text-xs font-medium text-neutral-200">Instagram</a>` : ''}
                    ${liUrl ? `<a href="${escapeHtml(liUrl)}" target="_blank" rel="noopener noreferrer" class="btn-outline-morph px-3.5 py-2 text-xs font-medium text-neutral-200">LinkedIn</a>` : ''}
                    ${f.cv_file ? `<a href="${escapeHtml(f.cv_file)}" download="${escapeHtml(f.cv_file_nama || 'CV-RosseStudio.pdf')}" class="btn-outline-morph px-3.5 py-2 border-red-500/35 text-xs font-medium text-red-200">Unduh CV</a>` : ''}
                    ${cvLink ? `<a href="${escapeHtml(cvLink)}" target="_blank" rel="noopener noreferrer" class="btn-outline-morph px-3.5 py-2 border-red-500/35 text-xs font-medium text-red-200">Tautan CV</a>` : ''}
                  </div>
                </div>
                ${
                  maps.embedUrl
                    ? `
                  <div class="space-y-2.5">
                    <div class="w-full h-52 rounded-2xl overflow-hidden border border-white/10 bg-black/50">
                      <iframe
                        src="${escapeHtml(maps.embedUrl)}"
                        title="Peta Lokasi RosseStudio"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        class="w-full h-full border-0 opacity-95"
                      ></iframe>
                    </div>
                    ${
                      maps.externalUrl
                        ? `
                      <a href="${escapeHtml(maps.externalUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-medium text-red-300 hover:text-white transition-colors">
                        <span>Buka Lokasi di Google Maps</span>
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                      </a>
                    `
                        : ''
                    }
                  </div>
                `
                    : maps.externalUrl
                      ? `
                  <a href="${escapeHtml(maps.externalUrl)}" target="_blank" rel="noopener noreferrer" class="rounded-2xl border border-red-500/30 bg-red-950/20 p-4 flex items-center justify-between gap-3 hover:border-red-500/60 transition-colors">
                    <div class="space-y-0.5">
                      <div class="text-xs font-semibold text-white">Peta Lokasi Google Maps</div>
                      <div class="text-xs" style="color: var(--text-muted);">Ketuk untuk membuka pin lokasi langsung</div>
                    </div>
                    <svg class="w-5 h-5 text-red-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  </a>
                `
                      : ''
                }
              </div>

              <div class="lg:col-span-7 bento-card p-6 sm:p-8" data-aos="fade-left">
                <form id="inline-contact-form" class="space-y-4">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label for="inline-c-nama" class="block text-xs font-medium mb-1.5 text-neutral-300">Nama Lengkap</label>
                      <input id="inline-c-nama" name="nama" type="text" required maxlength="150" placeholder="Nama Anda" class="w-full rounded-xl bg-black/50 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500" />
                    </div>
                    <div>
                      <label for="inline-c-email" class="block text-xs font-medium mb-1.5 text-neutral-300">Alamat Email</label>
                      <input id="inline-c-email" name="email" type="email" required maxlength="254" placeholder="nama@domain.com" class="w-full rounded-xl bg-black/50 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500" />
                    </div>
                  </div>
                  <div>
                    <label for="inline-c-subjek" class="block text-xs font-medium mb-1.5 text-neutral-300">Subjek</label>
                    <input id="inline-c-subjek" name="subjek" type="text" required maxlength="250" placeholder="Kolaborasi Proyek / Booking Layanan" class="w-full rounded-xl bg-black/50 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500" />
                  </div>
                  <div>
                    <label for="inline-c-pesan" class="block text-xs font-medium mb-1.5 text-neutral-300">Pesan</label>
                    <textarea id="inline-c-pesan" name="pesan" rows="4" required maxlength="4000" placeholder="Ceritakan kebutuhan atau jadwal Anda..." class="w-full rounded-xl bg-black/50 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder:text-neutral-500 focus:outline-none focus:border-red-500"></textarea>
                  </div>
                  <div id="inline-contact-status" class="hidden text-xs rounded-xl px-3.5 py-2.5"></div>
                  <div class="pt-1 flex flex-wrap items-center gap-3">
                    <button type="submit" class="btn-crimson px-6 py-3 text-sm font-semibold">Kirim Pesan</button>
                    ${waUrl ? `<a href="${escapeHtml(waUrl)}" target="_blank" rel="noopener noreferrer" class="btn-outline-morph px-5 py-3 text-xs font-semibold text-neutral-200">Chat WhatsApp</a>` : ''}
                  </div>
                </form>
              </div>
            </div>
          </div>
        `;

        document.getElementById('inline-contact-form').addEventListener('submit', (e) => {
          e.preventDefault();
          handleContactSubmit(e.currentTarget, document.getElementById('inline-contact-status'));
        });

        if (f.teks_copyright_dinamis) {
          footerBarEl.classList.remove('hidden');
          footerBarEl.textContent = f.teks_copyright_dinamis;
        } else {
          footerBarEl.classList.add('hidden');
        }

        if (waUrl) {
          floatingWaEl.href = waUrl;
          floatingWaEl.classList.remove('hidden');
          floatingWaEl.classList.add('inline-flex');
        } else {
          floatingWaEl.classList.add('hidden');
          floatingWaEl.classList.remove('inline-flex');
        }
      }

      function renderAll() {
        applyThemePalette(state.activeTheme || 'obsidian-crimson');
        renderNavigation();

        if (!loadingEl.classList.contains('hidden')) {
          return;
        }

        if (isPortfolioStateEmpty(state)) {
          emptyEl.classList.remove('hidden');
          sectionsWrapperEl.classList.add('hidden');
          footerBarEl.classList.add('hidden');
          floatingWaEl.classList.add('hidden');
          floatingWaEl.classList.remove('inline-flex');
          return;
        }

        emptyEl.classList.add('hidden');
        sectionsWrapperEl.classList.remove('hidden');

        renderHero();
        renderAboutAndEducations();
        renderAppProjects();
        renderExpertiseCategories();
        renderExperiencesAndAchievements();
        renderSkills();
        renderCreativeStudio();
        renderPublications();
        renderCertificates();
        renderTestimonials();
        renderFaqs();
        renderContactAndFooter();

        if (window.AOS) {
          requestAnimationFrame(() => window.AOS.refreshHard());
        }
      }

      // Optional isolated preview fixture injection ONLY when explicitly provided via sessionStorage in automated verification
      let testFixtureApplied = false;
      try {
        const rawFixture = sessionStorage.getItem('__rosse_test_fixture');
        if (rawFixture) {
          const parsed = JSON.parse(rawFixture);
          Object.assign(state, parsed);
          testFixtureApplied = true;
          loadingEl.classList.add('hidden');
          loadingEl.setAttribute('aria-busy', 'false');
          renderAll();
        }
      } catch {
        // Ignore storage access restrictions
      }

      if (!testFixtureApplied) {
        testFirestoreConnection();

        const subscribeSingleton = (colName, assignFn) => {
          onSnapshot(
            collection(db, colName),
            (snap) => {
              assignFn(snap.docs[0] ? { id: snap.docs[0].id, ...snap.docs[0].data() } : null);
              markLoaded(colName);
            },
            () => markLoaded(colName)
          );
        };

        const subscribeList = (colName, stateKey) => {
          onSnapshot(
            collection(db, colName),
            (snap) => {
              state[stateKey] = sortByNewest(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
              markLoaded(colName);
            },
            () => markLoaded(colName)
          );
        };

        subscribeSingleton('site_themes', (docData) => {
          state.activeTheme = docData?.active_theme_name || 'obsidian-crimson';
        });
        subscribeSingleton('hero_settings', (docData) => {
          state.hero = docData;
        });
        subscribeSingleton('about_settings', (docData) => {
          state.about = docData;
        });
        subscribeSingleton('footer_contacts', (docData) => {
          state.footer = docData;
        });

        subscribeList('hero_socials', 'heroSocials');
        subscribeList('educations', 'educations');
        subscribeList('experiences', 'experiences');
        subscribeList('achievements', 'achievements');
        subscribeList('certificates', 'certificates');
        subscribeList('skills', 'skills');
        subscribeList('expertise_categories', 'categories');
        subscribeList('portfolio_items', 'portfolios');
        subscribeList('app_projects', 'appProjects');
        subscribeList('designs', 'designs');
        subscribeList('tutorials', 'tutorials');
        subscribeList('books', 'books');
        subscribeList('journals', 'journals');
        subscribeList('testimonials', 'testimonials');
        subscribeList('faqs', 'faqs');
      }
    </script>
  </body>
</html>
